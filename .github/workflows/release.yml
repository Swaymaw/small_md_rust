name: Automated Versioning & Release

on:
  push:
    branches:
      - main # or your release branch

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensure full git history is available

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install vnext
        run: cargo install --git https://github.com/harmony-labs/vnext

      - name: Calculate Next Version
        id: version
        run: |
          NEW_VERSION=$(vnext)
          STRIPPED_VERSION=${NEW_VERSION#v}
          echo "Calculated version: $STRIPPED_VERSION"
          echo "new_version=$STRIPPED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml Version
        run: |
          # Update the <version> element in Cargo.toml (using sed, for example)
          # Assumes your version is inside <version> tags in Cargo.toml.
          sed -i "s/<version>.*<\/version>/<version>${{ steps.version.outputs.new_version#v }}</version>/" Cargo.toml
          cat Cargo.toml

      - name: Commit updated version
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git add Cargo.toml
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.new_version }}"

      - name: Create Git Tag
        run: |
          git tag ${{ steps.version.outputs.new_version }}
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Push Changes
        run: |
          git push origin main
