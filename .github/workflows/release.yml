name: Automated Versioning & Release

on:
  push:
    branches:
      - main # or your release branch

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensure full git history is available
          token: ${{ secrets.GITHUB_TOKEN }} # Needed for pushing changes

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal
          components: rustfmt, clippy

      - name: Install vnext
        run: cargo install --git https://github.com/harmony-labs/vnext

      - name: Calculate Next Version
        id: version
        run: |
          NEW_VERSION=$(vnext)
          STRIPPED_VERSION=${NEW_VERSION#v}
          echo "Calculated version: $STRIPPED_VERSION"
          echo "new_version=$STRIPPED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml Version
        run: |
          # Update version in Cargo.toml (TOML format)
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.new_version }}\"/" Cargo.toml
          cat Cargo.toml # Verify the change

      - name: Commit updated version
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git add Cargo.toml
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.new_version }}"

      - name: Create Git Tag
        run: |
          git tag v${{ steps.version.outputs.new_version }}
          git push origin v${{ steps.version.outputs.new_version }}

      - name: Push Changes
        run: |
          git push origin main
